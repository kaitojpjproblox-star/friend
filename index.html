<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虹の原BRT抽選サイト</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 31, 50, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #6366f1;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* 上部流れるお知らせバー */
        .ticker-wrap {
            width: 100%;
            background: rgba(239, 68, 68, 0.2);
            border-bottom: 1px solid rgba(239, 68, 68, 0.4);
            overflow: hidden;
            white-space: nowrap;
            padding: 10px 0;
        }
        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: ticker 20s linear infinite;
            font-weight: bold;
            color: #fca5a5;
        }
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* ヘッダー */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
        }
        .site-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* コンテナ＆ガラス風カード */
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* UI要素 */
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
        }
        .btn:hover { background-color: #4f46e5; }
        .btn-admin { width: auto; padding: 6px 16px; font-size: 0.85rem; }
        .btn-danger { background-color: var(--danger-color); }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-success { background-color: var(--success-color); }
        .btn-success:hover { background-color: #059669; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--text-muted); }
        .input-control {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }

        .checkbox-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .checkbox-item { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; cursor: pointer; }

        /* 管理画面（モーダルスタイル） */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-content {
            max-width: 800px;
            margin: 40px auto;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.85rem;
        }
        th, td { padding: 10px; border: 1px solid var(--border-color); text-align: left; }
        th { background: rgba(255, 255, 255, 0.05); }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="ticker-wrap">
        <div class="ticker-move">不正はばれます。抽選権を剥奪します。by某先輩</div>
    </div>

    <header class="header-nav">
        <div class="site-title"><i class="fa-solid fa-bus"></i> 虹の原BRT抽選サイト</div>
        <button onclick="openAdminLogin()" class="btn btn-admin">管理者ログイン</button>
    </header>

    <div class="container">
        <div class="glass-card">
            
            <div id="results-section" class="hidden">
                <h2><i class="fa-solid fa-trophy"></i> 抽選結果</h2>
                <h3>当選者 (20名)</h3>
                <ol id="winners-list"></ol>
                <h3>補欠 (5名)</h3>
                <ol id="substitutes-list"></ol>
            </div>

            <div id="form-section">
                <p style="text-align: center; color: var(--text-muted); margin-bottom: 20px;">
                    <i class="fa-solid fa-clock"></i> 抽選結果は <strong>2026年8月7日 10:00</strong> に公開されます。
                </p>
                <hr style="border-color: var(--border-color); margin-bottom: 25px;">

                <div id="join-form-wrapper">
                    <form id="joinForm">
                        <div class="input-group">
                            <label for="roblox_name">Roblox ネーム <span style="color:red">*</span></label>
                            <input type="text" id="roblox_name" class="input-control" placeholder="ユーザー名を入力" required>
                        </div>

                        <div class="checkbox-group">
                            <label class="checkbox-item"><input type="checkbox" required> 抽選するものは13歳以上であること</label>
                            <label class="checkbox-item"><input type="checkbox" required> 過去に警告歴がないこと</label>
                            <label class="checkbox-item"><input type="checkbox" required> イベントに参加できること</label>
                        </div>

                        <button type="submit" class="btn">抽選に参加する</button>
                    </form>
                </div>

                <div id="joined-message" class="hidden" style="text-align: center; padding: 20px; color: var(--success-color);">
                    <h2><i class="fa-solid fa-circle-check"></i> 参加完了</h2>
                    <p>参加ありがとうございました。</p>
                </div>
            </div>

        </div>
    </div>

    <div id="adminModal" class="modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>管理者ダッシュボード</h2>
                <button onclick="closeAdmin()" class="btn btn-admin btn-danger">閉じる</button>
            </div>
            
            <p>現在の参加人数: <strong id="admin-count">0</strong> 名</p>
            <button onclick="runLottery()" class="btn btn-success" style="margin-bottom: 20px;">抽選（または再抽選）を実行する</button>

            <h3>参加者一覧</h3>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th><th>Robloxネーム</th><th>参加日時</th><th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 設定＆ブラウザ内ストレージ管理
        const TARGET_DATE = new Date('2026-08-07T10:00:00+09:00');
        const ADMIN_USER = 'kaitojpjp';
        const ADMIN_PASS = 'nijinohara1212';

        function getParticipants() {
            return JSON.parse(localStorage.getItem('brt_participants') || '[]');
        }
        function saveParticipants(data) {
            localStorage.setItem('brt_participants', JSON.stringify(data));
        }
        function getResults() {
            return JSON.parse(localStorage.getItem('brt_results') || 'null');
        }

        // 初期化処理
        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            
            // 2026/8/7 10:00 以降なら結果表示
            if (now >= TARGET_DATE) {
                document.getElementById('form-section').classList.add('hidden');
                document.getElementById('results-section').classList.remove('hidden');
                renderPublicResults();
            }

            // 既に参加済みかチェック
            if (localStorage.getItem('brt_has_joined')) {
                showJoinedView();
            }
        });

        // 参加フォーム送信
        document.getElementById('joinForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('roblox_name').value.trim();
            if (!name) return;

            let list = getParticipants();
            if (list.some(p => p.roblox_name.toLowerCase() === name.toLowerCase())) {
                alert('このRobloxネームは既に送信済みです。');
                return;
            }

            const newEntry = {
                id: Date.now(),
                roblox_name: name,
                joined_at: new Date().toLocaleString('ja-JP')
            };

            list.push(newEntry);
            saveParticipants(list);
            localStorage.setItem('brt_has_joined', 'true');

            showJoinedView();
        });

        function showJoinedView() {
            document.getElementById('join-form-wrapper').classList.add('hidden');
            document.getElementById('joined-message').classList.remove('hidden');
        }

        // 抽選結果の一般表示
        function renderPublicResults() {
            const results = getResults();
            const wList = document.getElementById('winners-list');
            const sList = document.getElementById('substitutes-list');
            wList.innerHTML = ''; sList.innerHTML = '';

            if (!results) {
                wList.innerHTML = '<li>まだ抽選が実行されていません。</li>';
                return;
            }

            results.winners.forEach(w => wList.innerHTML += `<li>${w.roblox_name}</li>`);
            results.substitutes.forEach(s => sList.innerHTML += `<li>${s.roblox_name}</li>`);
        }

        // 管理者ログイン・画面制御
        function openAdminLogin() {
            const u = prompt('管理者ユーザー名を入力してください:');
            const p = prompt('管理者パスワードを入力してください:');

            if (u === ADMIN_USER && p === ADMIN_PASS) {
                renderAdminTable();
                document.getElementById('adminModal').style.display = 'block';
            } else {
                alert('認証情報が正しくありません。');
            }
        }

        function closeAdmin() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function renderAdminTable() {
            const list = getParticipants();
            document.getElementById('admin-count').innerText = list.length;
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';

            list.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.roblox_name}</td>
                        <td>${p.joined_at}</td>
                        <td><button onclick="deleteParticipant(${p.id})" style="color:red; background:none; border:none; cursor:pointer;"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `;
            });
        }

        function deleteParticipant(id) {
            if (!confirm('この参加者を削除しますか？')) return;
            let list = getParticipants().filter(p => p.id !== id);
            saveParticipants(list);
            renderAdminTable();
        }

        // 抽選実行機能
        function runLottery() {
            const list = getParticipants();
            if (list.length < 25) {
                alert('参加者が25名未満のため抽選できません。(当選20名 + 補欠5名)');
                return;
            }

            if (!confirm('抽選を実行しますか？（前回の抽選結果は上書きされます）')) return;

            // シャッフル
            const shuffled = [...list].sort(() => 0.5 - Math.random());
            const results = {
                winners: shuffled.slice(0, 20),
                substitutes: shuffled.slice(20, 25)
            };

            localStorage.setItem('brt_results', JSON.stringify(results));
            alert('抽選が正常に完了しました！');
        }
    </script>
</body>
</html>
